name: OKE Image Build and Promote

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Branch, tag, or commit SHA to build the application image from'
        required: true
        default: 'main'
        type: string
      manifest_ref:
        description: 'Branch, tag, or commit SHA to copy the latest k8s/oke manifests from'
        required: true
        default: 'main'
        type: string
      deploy_branch:
        description: 'GitOps branch watched by Argo CD'
        required: true
        default: 'deploy/oke'
        type: string

concurrency:
  group: oke-cd-${{ inputs.deploy_branch }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: url-shortener

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_version: ${{ steps.source.outputs.image_version }}
      image_digest: ${{ steps.build.outputs.digest }}
      source_revision: ${{ steps.source.outputs.revision }}

    steps:
      - name: Checkout source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source revision
        id: source
        run: |
          REVISION="$(git rev-parse HEAD)"
          SHORT_REVISION="$(git rev-parse --short=12 HEAD)"
          echo "revision=${REVISION}" >> "${GITHUB_OUTPUT}"
          echo "short_revision=${SHORT_REVISION}" >> "${GITHUB_OUTPUT}"
          echo "image_version=sha-${SHORT_REVISION}" >> "${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY || env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.source.outputs.image_version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  promote-manifest:
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write

    steps:
      - name: Checkout latest manifests
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.manifest_ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Set up Kustomize
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.7.1
          echo "${HOME}/go/bin" >> "${GITHUB_PATH}"
          "${HOME}/go/bin/kustomize" version

      - name: Prepare deploy branch manifests
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
        run: |
          if ! git check-ref-format --branch "${DEPLOY_BRANCH}" >/dev/null; then
            echo "Invalid deploy_branch: ${DEPLOY_BRANCH}"
            exit 1
          fi

          if [ ! -f k8s/oke/kustomization.yaml ]; then
            echo "manifest_ref must contain k8s/oke/kustomization.yaml"
            exit 1
          fi

          MANIFEST_SOURCE="$(mktemp -d)"
          cp -a k8s/oke/. "${MANIFEST_SOURCE}/"

          if git ls-remote --exit-code --heads origin "${DEPLOY_BRANCH}" >/dev/null; then
            git fetch origin "refs/heads/${DEPLOY_BRANCH}:refs/heads/${DEPLOY_BRANCH}"
          fi

          if git show-ref --verify --quiet "refs/heads/${DEPLOY_BRANCH}"; then
            git switch "${DEPLOY_BRANCH}"
          else
            git switch --orphan "${DEPLOY_BRANCH}"
            git rm -r --ignore-unmatch .
          fi

          mkdir -p k8s/oke
          find k8s/oke -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          cp -a "${MANIFEST_SOURCE}/." k8s/oke/

      - name: Update deploy image
        env:
          IMAGE_REPO: ${{ secrets.OCIR_REGISTRY }}/${{ secrets.OCIR_NAMESPACE }}/${{ secrets.OCIR_REPOSITORY || env.IMAGE_NAME }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image_digest }}
          IMAGE_VERSION: ${{ needs.build-push.outputs.image_version }}
          SOURCE_REVISION: ${{ needs.build-push.outputs.source_revision }}
        run: |
          if ! printf '%s' "${IMAGE_DIGEST}" | grep -Eq '^sha256:[a-f0-9]{64}$'; then
            echo "Invalid image digest from build: ${IMAGE_DIGEST}"
            exit 1
          fi

          IMAGE_REF="${IMAGE_REPO}@${IMAGE_DIGEST}"
          echo "Built image tag: ${IMAGE_VERSION}"
          echo "Built image digest: ${IMAGE_REF}"
          echo "Built source revision: ${SOURCE_REVISION}"
          cd k8s/oke
          kustomize edit set image "${IMAGE_REPO}=${IMAGE_REF}"
          kustomize build . >/tmp/oke-manifests.yaml

      - name: Commit Kubernetes image promotion
        env:
          DEPLOY_BRANCH: ${{ inputs.deploy_branch }}
          IMAGE_VERSION: ${{ needs.build-push.outputs.image_version }}
          SOURCE_REVISION: ${{ needs.build-push.outputs.source_revision }}
        run: |
          if [ -z "$(git status --porcelain -- k8s/oke)" ]; then
            echo "Deploy branch already references this manifest state and image digest."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/oke
          git commit -m "chore: promote OKE image ${IMAGE_VERSION}" -m "Source revision: ${SOURCE_REVISION}"
          git push origin "HEAD:${DEPLOY_BRANCH}"
